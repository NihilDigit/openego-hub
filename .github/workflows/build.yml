name: Native ARM64 Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-arm64:
    # Use the native GitHub-hosted Windows ARM64 runner.
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure MSVC for ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # cl.exe, not clang: the settings window is gated on MSVC (it is built by MSBuild
      # from a .vcxproj), so a clang configuration silently drops it and CI would verify
      # something other than what ships. Do not pass CMAKE_*_COMPILER_TARGET here either
      # -- it is clang-only, and it makes CMake emit GNU-style link flags cl.exe cannot
      # parse.
      - name: CMake Configure
        run: |
          cmake -G "Ninja" -S . -B build `
                -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_C_COMPILER=cl `
                -DCMAKE_CXX_COMPILER=cl `
                -DHIMAX_ENABLE_NEON=ON `
                -DEGO_BUILD_TESTS=ON

      - name: CMake Build
        run: cmake --build build --config Release --parallel

      # The runner has no touch controller, so only the tests that declare themselves
      # device-free are run. The admin label is excluded on top of that: the IPC control
      # pipe carries an administrator-only ACL, and its loopback test cannot connect
      # under the runner's token.
      - name: Run device-free tests
        working-directory: build
        run: ctest --output-on-failure -L device-free -LE admin
